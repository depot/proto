syntax = "proto3";
package depot.core.v1;

import "google/protobuf/timestamp.proto";

service BuildService {
  // Share a URL to a build with users outside of your organization
  rpc ShareBuild(ShareBuildRequest) returns (ShareBuildResponse);

  // Stop sharing a build
  rpc StopSharingBuild(StopSharingBuildRequest) returns (StopSharingBuildResponse);

  // List the builds in your organization
  rpc ListBuilds(ListBuildsRequest) returns (ListBuildsResponse);

  // Get the build metadata of a build
  rpc GetBuild(GetBuildRequest) returns (GetBuildResponse);

  // Request cancellation of a build. Execution stops asynchronously; use `GetBuild` to observe the final outcome.
  // Requires an organization credential with write access. Repeated requests are safe.
  rpc CancelBuild(CancelBuildRequest) returns (CancelBuildResponse);

  // Export resource utilization for completed builds, newest first. Requires organization read access.
  // Metrics describe shared builder machines, not resources attributable exclusively to one build.
  // More than 2,000 machine associations or a telemetry span exceeding seven days returns ResourceExhausted.
  rpc ListBuildMetrics(ListBuildMetricsRequest) returns (ListBuildMetricsResponse);

  // Summarize resource utilization across completed builds, counting overlapping machine samples once.
  // Requires organization read access. More than 1,000 builds or 2,000 machine associations returns ResourceExhausted;
  // request a smaller completion-time range in that case. A telemetry span exceeding seven days also returns
  // ResourceExhausted. Store failures never return partial statistics.
  rpc GetProjectBuildMetrics(GetProjectBuildMetricsRequest) returns (GetProjectBuildMetricsResponse);
}

message ListBuildMetricsRequest {
  // Unique identifier for the project. Returned by `ListProjects` and `GetProject`.
  string project_id = 1;
  // Inclusive lower bound on build completion time, in RFC 3339 format. Required, with millisecond precision.
  google.protobuf.Timestamp start_at = 2;
  // Exclusive upper bound on build completion time, in RFC 3339 format. Required, with millisecond precision.
  // Must follow `startAt`, must not be in the future, and must be at most seven days after `startAt`.
  google.protobuf.Timestamp end_at = 3;
  // Number of builds to return per page. Maximum: 50. Default: 20.
  int32 page_size = 4;
  // Token to fetch the next page. Leave empty to fetch the first page. Keep the project and time range unchanged.
  string page_token = 5;
}

message ListBuildMetricsResponse {
  // Completed builds, ordered by completion time and build identifier, both descending.
  // Pagination is not a database snapshot; records and late-arriving telemetry may change between requests.
  repeated BuildResourceMetrics builds = 1;
  // Token to fetch the next page. Empty when there are no more builds.
  string next_page_token = 2;
}

message GetProjectBuildMetricsRequest {
  // Unique identifier for the project. Returned by `ListProjects` and `GetProject`.
  string project_id = 1;
  // Inclusive lower bound on build completion time, in RFC 3339 format. Required, with millisecond precision.
  google.protobuf.Timestamp start_at = 2;
  // Exclusive upper bound on build completion time, in RFC 3339 format. Required, with millisecond precision.
  // Must follow `startAt`, must not be in the future, and must be at most seven days after `startAt`.
  google.protobuf.Timestamp end_at = 3;
}

message GetProjectBuildMetricsResponse {
  // Number of completed builds selected, including builds without telemetry.
  uint32 build_count = 1;
  // Number of selected builds without a recorded machine association.
  uint32 builds_without_machines = 2;
  // Statistics across unique machine-seconds within the selected builds' machine-association windows.
  // Overlapping builds sharing a machine contribute each sample once. Separate requests can still overlap;
  // do not sum their statistics or average their averages to obtain a combined project summary.
  BuildResourceStatistics statistics = 3;
  // Statistics for each architecture with a recorded machine association.
  repeated BuildArchitectureMetrics architectures = 4;
}

message BuildResourceMetrics {
  // Unique identifier for the build. Use with `GetBuild` for additional metadata.
  string build_id = 1;
  // Build creation time, in RFC 3339 format.
  google.protobuf.Timestamp created_at = 2;
  // Build completion time, in RFC 3339 format.
  google.protobuf.Timestamp finished_at = 3;
  // Hardware recorded on the build. Empty when unknown; does not prove the capacity of each associated machine.
  string hardware = 4;
  // Statistics per associated machine, including machines without telemetry. Empty when no machine was recorded.
  // Samples cover each association's start through build completion, with an exclusive end. A reassigned machine's
  // window ends at the next association for that architecture. Usage can include concurrent builds and host processes.
  // A telemetry span exceeding seven days returns ResourceExhausted rather than truncated statistics.
  repeated BuildMachineMetrics machines = 5;
}

message BuildMachineMetrics {
  // Unique identifier for the builder machine.
  string machine_id = 1;
  // Machine architecture. Can be "amd64" or "arm64".
  string architecture = 2;
  // Beginning of the observed association window, in RFC 3339 format.
  google.protobuf.Timestamp start_at = 3;
  // Exclusive end of the observed association window, in RFC 3339 format.
  google.protobuf.Timestamp end_at = 4;
  // Statistics over available telemetry. Zero sample counts mean no data, not zero utilization.
  BuildResourceStatistics statistics = 5;
}

message BuildArchitectureMetrics {
  // Machine architecture. Can be "amd64" or "arm64".
  string architecture = 1;
  // Statistics across unique machine-seconds for this architecture.
  BuildResourceStatistics statistics = 2;
}

message BuildResourceStatistics {
  // Number of machine-seconds with CPU measurements, after deduplicating each core's samples within each second.
  uint32 cpu_sample_count = 1;
  // Mean user-mode CPU utilization as a fraction from 0 to 1. Each machine-second is weighted equally;
  // each observed core within that second is weighted equally. Excludes system CPU time. Unset without CPU samples.
  optional double average_cpu_utilization = 2;
  // Highest per-machine, per-second mean CPU utilization. Unset without CPU samples.
  optional double peak_cpu_utilization = 3;
  // Number of machine-seconds with used-memory utilization measurements.
  uint32 memory_sample_count = 4;
  // Mean used-memory utilization as a fraction from 0 to 1, weighted equally per machine-second.
  // Unset without memory samples. Memory bytes and historical capacity cannot be inferred from this value alone.
  optional double average_memory_utilization = 5;
  // Highest used-memory utilization for any machine-second. Unset without memory samples.
  optional double peak_memory_utilization = 6;
}

message ShareBuildRequest {
  string build_id = 1;
}

message ShareBuildResponse {
  string share_url = 1;
}

message StopSharingBuildRequest {
  string build_id = 1;
}

message StopSharingBuildResponse {}

message ListBuildsRequest {
  string project_id = 1;
  optional int32 page_size = 2;
  optional string page_token = 3;
}

message ListBuildsResponse {
  repeated Build builds = 1;
  string next_page_token = 2;
}

message GetBuildRequest {
  string build_id = 1;
}

message GetBuildResponse {
  Build build = 1;
}

message CancelBuildRequest {
  // Unique identifier for the build. Returned by `ListBuilds` and `GetBuild`.
  string build_id = 1;
}

message CancelBuildResponse {
  // Result of requesting cancellation. Does not confirm that execution has stopped.
  Outcome outcome = 1;

  enum Outcome {
    OUTCOME_UNSPECIFIED = 0;
    // Cancellation was requested, including repeated requests for a running build.
    OUTCOME_CANCELLATION_REQUESTED = 1;
    // The build had already completed. Its final outcome is unchanged.
    OUTCOME_ALREADY_TERMINAL = 2;
  }
}

message Build {
  string build_id = 1;
  Status status = 2;
  google.protobuf.Timestamp created_at = 3;
  optional google.protobuf.Timestamp started_at = 4;
  optional google.protobuf.Timestamp finished_at = 5;
  optional int32 build_duration_seconds = 6;
  optional int32 saved_duration_seconds = 7;
  optional int32 cached_steps = 8;
  optional int32 total_steps = 9;

  enum Status {
    STATUS_UNSPECIFIED = 0;
    STATUS_RUNNING = 1;
    STATUS_FAILED = 2;
    STATUS_SUCCESS = 3;
    STATUS_ERROR = 4;
    STATUS_CANCELED = 5;
  }
}
